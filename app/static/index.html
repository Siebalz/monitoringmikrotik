<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantau Jaringan MikroTik</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101a20'/%3E%3Cpath d='M5 21h5l3-9 4 13 3-8h7' fill='none' stroke='%233987e5' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="brand big"><svg viewBox="0 0 32 32" width="34" height="34"><path d="M3 21h6l4-11 5 15 4-10h7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-name">Pantau Jaringan</span></div>
    <p class="muted">Masuk untuk melihat status semua router MikroTik.</p>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <div id="loginErr" class="form-err" role="alert"></div>
    <button class="btn primary" type="submit">Masuk</button>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <a class="brand" href="#/"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M3 21h6l4-11 5 15 4-10h7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-name">Pantau Jaringan</span></a>
    <nav id="nav">
      <a href="#/" data-p="dash"><svg viewBox="0 0 20 20"><path d="M3 11h5V3H3zm9 6h5V9h-5zM3 17h5v-3H3zm9-9h5V3h-5z"/></svg><span>Dashboard</span></a>
      <a href="#/latency" data-p="latency"><svg viewBox="0 0 20 20"><path d="M2 10h3l2-5 3 10 2-7 1.5 2H18"/></svg><span>Latency</span></a>
      <a href="#/users" data-p="users" class="admin-only"><svg viewBox="0 0 20 20"><circle cx="8" cy="7" r="3"/><path d="M2.5 16c.5-3 2.7-4.5 5.5-4.5s5 1.5 5.5 4.5M14 4.5a2.8 2.8 0 0 1 0 5M15.5 11.8c1.6.6 2.6 2 3 4.2"/></svg><span>Klien</span></a>
      <a href="#/vpn" data-p="vpn" class="admin-only"><svg viewBox="0 0 20 20"><path d="M10 2.5 4 5v4.5c0 3.6 2.4 6.3 6 8 3.6-1.7 6-4.4 6-8V5zM7.5 10l2 2 3.5-4"/></svg><span>VPN</span></a>
      <a href="#/routers" data-p="routers" class="admin-only"><svg viewBox="0 0 20 20"><path d="M2 12h16v5H2zM5 14.5h.01M8 14.5h.01M6 12V8M14 12V8M3.5 6a9 9 0 0 1 13 0M6 8.2a5 5 0 0 1 8 0"/></svg><span>Router</span></a>
      <a href="#/events" data-p="events"><svg viewBox="0 0 20 20"><path d="M10 3a5 5 0 0 0-5 5v3l-1.5 3h13L15 11V8a5 5 0 0 0-5-5zM8 16a2 2 0 0 0 4 0"/></svg><span>Riwayat alert</span></a>
      <a href="#/settings" data-p="settings" class="admin-only"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg><span>Pengaturan</span></a>
      <a href="#/account" data-p="account" class="client-only"><svg viewBox="0 0 20 20"><circle cx="10" cy="7" r="3.2"/><path d="M3.5 17c.6-3.4 3.1-5 6.5-5s5.900 1.600 6.500 5"/></svg><span>Akun saya</span></a>
    </nav>
    <div class="side-foot">
      <button class="btn ghost sm" id="themeBtn" type="button">Tema</button>
      <button class="btn ghost sm" id="logoutBtn" type="button">Keluar</button>
    </div>
  </aside>
  <main id="main" class="main"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/vendor/chart.umd.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
